apiVersion: v1
kind: ConfigMap
metadata:
  name: volcano-scheduler-configmap
  namespace: volcano-system
data:
  volcano-scheduler.conf: |
    actions: "enqueue, allocate, backfill"
    tiers:
    - plugins:
      - name: priority
      - name: gang
        enablePreemptable: false
      - name: conformance
    - plugins:
      - name: overcommit
      - name: drf
        enablePreemptable: false
      - name: predicates
      - name: proportion
      - name: nodeorder
      - name: binpack
      - name: model-locality
        arguments:
          # Cache hit is a soft score, not a hard filter. A pod can still run on
          # a cold node when no cached node has enough resources.
          cache-hit.weight: 20
          # Small bonus for staying near already placed pods of the same instance.
          same-topology-bonus.weight: 3
